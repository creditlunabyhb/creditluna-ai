name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping CreditLuna
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" https://creditluna.com/
